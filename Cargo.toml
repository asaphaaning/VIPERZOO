[workspace]
members = [
  "crates/adapter-api",
  "crates/actions",
  "crates/adapter-frida",
  "crates/assets",
  "crates/capture",
  "crates/engine",
  "crates/navigation",
  "crates/sdk",
  "crates/protocol",
  "crates/web",
  "crates/world",
  "apps/cli",
  "apps/live",
  "apps/replay",
  "apps/verify",
  "apps/walk",
  "apps/woodcut",
]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT OR Apache-2.0"
rust-version = "1.97"
version      = "0.1.0"

[workspace.dependencies]
frida = { git = "https://github.com/frida/frida-rust", rev = "080e8a99a542150359c835cd8b572f699f7a2313", features = [
  "auto-download",
] }
axum = { version = "0.8", default-features = false, features = [ "http1", "tokio" ] }
hex = "0.4.3"
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = "1.49"
tokio-stream = { version = "0.1", features = [ "sync" ] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
# `viperzoo-adapter-frida` contains the one audited FFI boundary. Keeping this
# at `deny` lets that module opt out locally while every other crate remains
# unsafe-free through this workspace policy.
unsafe_code     = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all                    = { level = "warn", priority = -1 }
dbg_macro              = "deny"
expect_used            = "deny"
panic                  = "deny"
should_implement_trait = "allow"
todo                   = "deny"
unimplemented          = "deny"
unreachable            = "deny"
unwrap_used            = "deny"
wildcard_imports       = "deny"
