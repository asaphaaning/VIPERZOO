[package]
name                   = "viperzoo-web"
description            = "Browser projection of the live engine world state and tracing stream."
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
[dependencies.axum]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.tokio]
features  = [ "net", "rt", "sync", "time" ]
workspace = true

[dependencies.tokio-stream]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.viperzoo-assets]
path = "../assets"

[dependencies.viperzoo-engine]
path = "../engine"

[dependencies.viperzoo-protocol]
path = "../protocol"

[dependencies.viperzoo-world]
path = "../world"

[dev-dependencies]
[dev-dependencies.tokio]
features  = [ "macros", "rt" ]
workspace = true
