[package]
edition.workspace      = true
license.workspace      = true
name                   = "viperzoo-sdk"
rust-version.workspace = true
version.workspace      = true

[dependencies]
thiserror.workspace          = true
tokio = { workspace = true, features = [ "rt", "time" ] }
tokio-stream.workspace       = true
tracing.workspace            = true
viperzoo-actions     = { version = "0.1.0", path = "../actions" }
viperzoo-adapter-api = { version = "0.1.0", path = "../adapter-api" }
viperzoo-assets      = { version = "0.1.0", path = "../assets" }
viperzoo-engine      = { version = "0.1.0", path = "../engine" }
viperzoo-navigation  = { version = "0.1.0", path = "../navigation" }
viperzoo-protocol    = { version = "0.1.0", path = "../protocol" }
viperzoo-world       = { version = "0.1.0", path = "../world" }
viperzoo-web         = { version = "0.1.0", path = "../web" }

[dev-dependencies]
tokio = { workspace = true, features = [ "macros", "rt" ] }
viperzoo-adapter-api = { version = "0.1.0", path = "../adapter-api", features = [ "test-util" ] }

[lints]
workspace = true
